<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED 120 PING</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-center relative">
            <div class="absolute top-3 right-3 flex items-center space-x-1.5 bg-black/30 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-medium text-emerald-400 border border-emerald-500/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="status-text">Ready</span>
            </div>
            <h1 class="text-xl font-bold tracking-wide text-white uppercase"><i class="fa-solid fa-satellite-dish mr-2"></i>MED 120 PING</h1>
            <p class="text-xs text-blue-100 mt-1">Real-time Lead Routing Dispatcher</p>
        </div>

        <!-- Form Body -->
        <form id="pingForm" class="p-6 space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                    <i class="fa-solid fa-phone-volume mr-1.5 text-blue-500"></i> Caller ID
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 font-mono text-sm">+1</span>
                    <input type="tel" id="caller_id" name="caller_id" required placeholder="5551234567" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition font-mono text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                    <i class="fa-solid fa-stopwatch mr-1.5 text-blue-500"></i> Auto Ping Loop Interval
                </label>
                <select id="auto_interval" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
                    <option value="0">Manual / Off</option>
                    <option value="5">Every 5 Seconds</option>
                    <option value="10" selected>Every 10 Seconds</option>
                </select>
            </div>

            <div class="pt-2">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition duration-200 flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span id="btnText">Send Ping</span>
                </button>
            </div>
        </form>

        <!-- Response Console -->
        <div id="responseBox" class="hidden mx-6 mb-6 p-4 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-slate-300">
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800 text-slate-500">
                <span>Response Log</span>
                <span id="responseTimestamp">--:--:--</span>
            </div>
            <div id="responseContent" class="overflow-x-auto whitespace-pre-wrap break-all text-slate-400"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('pingForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const statusText = document.getElementById('status-text');
        const responseBox = document.getElementById('responseBox');
        const responseContent = document.getElementById('responseContent');
        const responseTimestamp = document.getElementById('responseTimestamp');
        const autoIntervalSelect = document.getElementById('auto_interval');

        let autoPingTimer = null;

        const executePing = async () => {
            let rawPhone = document.getElementById('caller_id').value.trim();
            if (!rawPhone) return;

            let formattedPhone = rawPhone.startsWith('+1') ? rawPhone : '+1' + rawPhone.replace(/^\+/, '');

            statusText.textContent = "Sending...";
            statusText.className = "text-xs font-medium text-amber-400";
            btnText.textContent = "Processing...";
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/ping', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ caller_id: formattedPhone })
                });

                const resultText = await response.text();
                
                responseBox.classList.remove('hidden');
                responseTimestamp.textContent = new Date().toLocaleTimeString();
                responseContent.textContent = resultText;
                
                statusText.textContent = "Online";
                statusText.className = "text-xs font-medium text-emerald-400";
            } catch (error) {
                responseBox.classList.remove('hidden');
                responseTimestamp.textContent = new Date().toLocaleTimeString();
                responseContent.textContent = "Error: " + error.message;
                
                statusText.textContent = "Error";
                statusText.className = "text-xs font-medium text-rose-400";
            } finally {
                btnText.textContent = "Send Ping";
                submitBtn.disabled = false;
            }
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            executePing();
        });

        autoIntervalSelect.addEventListener('change', (e) => {
            if (autoPingTimer) {
                clearInterval(autoPingTimer);
                autoPingTimer = null;
            }

            const intervalSeconds = parseInt(e.target.value);
            if (intervalSeconds > 0) {
                autoPingTimer = setInterval(() => {
                    const phoneVal = document.getElementById('caller_id').value.trim();
                    if (phoneVal) {
                        executePing();
                    }
                }, intervalSeconds * 1000);
            }
        });
    </script>
</body>
</html>
